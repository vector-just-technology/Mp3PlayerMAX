<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Mp3PlayerMAX</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">🎵 Mp3PlayerMAX</div>
  <div class="tabs">
    <button class="tab active" data-tab="player">Player</button>
    <button class="tab" data-tab="camera">Camera</button>
    <button class="tab" data-tab="bluetooth">Bluetooth</button>
  </div>
</header>

<!-- ══════════════════════════════════════════════════
     TAB: PLAYER
════════════════════════════════════════════════════ -->
<section id="tab-player" class="tab-content active">

  <!-- Now Playing -->
  <div class="now-playing">
    <div class="album-art">🎵</div>
    <div class="track-info">
      <div id="track-name" class="track-name">No track selected</div>
      <div id="track-status" class="track-status">Stopped</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btn-prev" onclick="apiPost('/api/prev')" title="Previous">⏮</button>
    <button id="btn-play" onclick="togglePlay()" title="Play/Pause" class="btn-primary">▶</button>
    <button id="btn-stop" onclick="apiPost('/api/stop')" title="Stop">⏹</button>
    <button id="btn-next" onclick="apiPost('/api/next')" title="Next">⏭</button>
    <button id="btn-shuffle" onclick="apiPost('/api/shuffle')" title="Shuffle">🔀</button>
  </div>

  <!-- Volume -->
  <div class="volume-row">
    <span>🔈</span>
    <input type="range" id="volume-slider" min="0" max="100" value="80"
           oninput="setVolume(this.value)"/>
    <span id="volume-label">80%</span>
    <span>🔊</span>
  </div>

  <!-- Audio output -->
  <div class="audio-output-row">
    <span class="label">Output:</span>
    <button class="output-btn active" id="btn-jack" onclick="switchOutput('jack')">🎧 Jack</button>
    <button class="output-btn" id="btn-bt" onclick="showTab('bluetooth')">📶 Bluetooth</button>
  </div>

  <!-- Library -->
  <div class="library-header">
    <span>🎵 Music Library</span>
    <button onclick="loadLibrary()" class="btn-small">↻ Refresh</button>
  </div>
  <ul id="library-list" class="library-list">
    <li class="placeholder">Loading...</li>
  </ul>

</section>

<!-- ══════════════════════════════════════════════════
     TAB: CAMERA
════════════════════════════════════════════════════ -->
<section id="tab-camera" class="tab-content">

  <div class="cam-container">
    <img id="cam-stream" src="/api/webcam/stream" alt="Webcam stream"
         onerror="this.src='/static/no-cam.svg'"/>
  </div>

  <div class="cam-controls">
    <button onclick="snapshot()" class="btn-primary">📷 Snapshot</button>
    <button id="btn-record" onclick="toggleRecord()">⏺ Record</button>
  </div>

  <div id="cam-message" class="cam-message"></div>

</section>

<!-- ══════════════════════════════════════════════════
     TAB: BLUETOOTH
════════════════════════════════════════════════════ -->
<section id="tab-bluetooth" class="tab-content">

  <div class="bt-section">
    <h2>Bluetooth Audio</h2>

    <div id="bt-current" class="bt-current">
      <span>Current output: <strong id="bt-output-label">3.5mm Jack</strong></span>
    </div>

    <button onclick="btScan()" class="btn-primary" id="btn-scan">🔍 Scan for Devices</button>
    <div id="bt-spinner" class="spinner hidden">Scanning (8s)...</div>

    <ul id="bt-device-list" class="bt-device-list"></ul>

    <div class="bt-manual">
      <p>Manual connect by MAC:</p>
      <input id="bt-mac-input" type="text" placeholder="AA:BB:CC:DD:EE:FF"/>
      <button onclick="btConnectManual()">Connect</button>
      <button onclick="switchOutput('jack')">Switch to Jack</button>
    </div>
  </div>

</section>

<!-- ── Status bar ── -->
<div id="status-bar" class="status-bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
